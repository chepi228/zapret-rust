name: native Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compatibility:
        description: Also run the legacy Cygwin compatibility checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.engine }})
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.compatibility && '["native-windows","cygwin"]' || '["native-windows"]') }}
    env:
      RUST_TOOLCHAIN: 1.99.1-x86_64-pc-windows-gnu
      ENGINE_FIXTURE: ${{ matrix.engine == 'cygwin' && 'foolingtest.lua' || 'native-platform.lua' }}
      ENGINE_CANDIDATE: ${{ matrix.engine == 'cygwin' && 'dist/native/ring-candidate' || 'dist/native/native-engine-candidate' }}
      ENGINE_VARIANT: ${{ matrix.engine }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Use the runner directory for Windows test fixtures
        run: |
          $fixtureTemp = Join-Path $env:RUNNER_TEMP 'zapret-fixtures'
          New-Item -ItemType Directory -Path $fixtureTemp -Force | Out-Null
          "TEMP=$fixtureTemp" >> $env:GITHUB_ENV
          "TMP=$fixtureTemp" >> $env:GITHUB_ENV
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$env:RUST_TOOLCHAIN" >> $env:GITHUB_ENV
      - name: Prepare pinned LLVM MinGW
        timeout-minutes: 8
        run: |
          $tools = Join-Path $PWD 'dist/rust-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $archive = Join-Path $tools 'llvm-mingw-20261104-ucrt-x86_64.zip'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-x86_64.zip' -OutFile $archive -TimeoutSec 180
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f') {
            throw 'Unexpected LLVM MinGW archive digest'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $llvm = Join-Path $tools 'llvm-mingw-20261104-ucrt-x86_64/bin'
          $compiler = Join-Path $llvm 'x86_64-w64-mingw32-clang.exe'
          $archiver = Join-Path $llvm 'llvm-ar.exe'
          "$llvm" >> $env:GITHUB_PATH
          "CC_x86_64_pc_windows_gnu=$compiler" >> $env:GITHUB_ENV
          "AR_x86_64_pc_windows_gnu=$archiver" >> $env:GITHUB_ENV
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Formatting
        run: cargo zapret fmt --check
      - name: Clippy
        run: cargo zapret check
      - name: Rust tests with local fixtures
        run: cargo zapret test
      - name: Native ring ABI compatibility fixtures
        run: cargo zapret check-ring
      - name: Prepare pinned engine sources
        timeout-minutes: 5
        run: |
          $sources = Join-Path $PWD 'dist/upstream/rust-ring-build'
          New-Item -ItemType Directory -Force -Path $sources | Out-Null
          $inputs = @(
            @{url='https://codeload.github.com/bol-van/zapret2/tar.gz/221d7dff24bfec0cd5ac0a5070b8acef2008af3d'; name='zapret2-221d7dff.tar.gz'; hash='c9925bb194eea8c19feb05ea6b24a848e8b50af8c64643b9e394ffe653327d87'},
            @{url='https://codeload.github.com/openresty/luajit2/tar.gz/refs/tags/v2.1-20250826'; name='luajit2-2.1-20250826.tar.gz'; hash='5a49743ad6ce4b7f19aac71b55a08052c1feb62750f051982082c12bf62f39c0'}
          )
          if ($env:ENGINE_VARIANT -eq 'native-windows') {
            $inputs += @{url='https://static.crates.io/crates/luna-core/luna-core-4.0.2.crate'; name='luna-core-4.0.2.crate'; hash='0162144beb06b927dce484b6447ca7ec6a62f331bbd257b6c16eab9186497c82'}
          }
          foreach ($inputFile in $inputs) {
            $path = Join-Path $sources $inputFile.name
            Invoke-WebRequest -Uri $inputFile.url -OutFile $path -TimeoutSec 90
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $inputFile.hash) {
              throw "Unexpected digest for $($inputFile.name)"
            }
          }
      - name: Prepare private Cygwin for the compatibility build
        if: matrix.engine == 'cygwin'
        timeout-minutes: 12
        run: |
          function Get-PinnedDownload($Url, $Path, $Algorithm, $Hash) {
            Invoke-WebRequest -Uri $Url -OutFile $Path -TimeoutSec 90
            if ((Get-FileHash -LiteralPath $Path -Algorithm $Algorithm).Hash -ne $Hash) {
              throw "Unexpected digest for $Url"
            }
          }
          $tools = Join-Path $PWD 'dist/rust-tools'
          $cache = Join-Path $tools 'cygwin-packages'
          $cygwin = Join-Path $tools 'cygwin'
          New-Item -ItemType Directory -Force -Path $tools,$cache | Out-Null
          $setup = Join-Path $tools 'cygwin-setup.exe'
          Get-PinnedDownload 'https://cygwin.com/setup/setup-2.941.x86_64.exe' $setup SHA512 '9bbbd4de497842446af58af875590ace5d8fa3c557cd7e27328569dfa68e58213da1cc1a6fb7102d4f0f01be38e0b92c6fa74f61b6eb7351a0481ca4bd9e8781'
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256) -ne '3AB2B14363B58A1856D4902C737797C899118095F7025DF7832C1B52483865A0') {
            throw 'Invalid Cygwin installer signature'
          }
          # Cygwin verifies the signed mirror index and the selected package archives.
          $packages = @(
            'cygwin=3.6.12-1', 'cygwin-devel=3.6.12-1', 'gcc-core=14.4.0-1',
            'binutils=2.47-1', 'make=4.4.1-2', 'w32api-headers=14.0.0-1', 'w32api-runtime=14.0.0-1',
            'zlib-devel=1.4-1', 'zlib0=1.4-1', 'pkg-config=3.0.10-1', 'tar=1.35-2', 'gzip=1.15-1'
          )
          $setupArgs = @(
            '--quiet-mode=hidden', '--no-admin', '--no-shortcuts', '--no-desktop', '--no-startmenu',
            '--no-write-registry', '--no-replaceonreboot',
            '--no-version-check', '--only-site', '--site', 'https://mirrors.kernel.org/sourceware/cygwin/',
            '--local-package-dir', ('"' + $cache + '"'), '--root', ('"' + $cygwin + '"'),
            '--packages', ($packages -join ',')
          )
          $process = Start-Process -FilePath $setup -ArgumentList $setupArgs -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Cygwin setup exited with $($process.ExitCode)" }
          $installed = Get-Content -LiteralPath (Join-Path $cygwin 'etc/setup/installed.db')
          foreach ($package in $packages) {
            $name, $version = $package -split '=', 2
            $pattern = [regex]::Escape("$name $name-$version") + '\.tar\.'
            if (-not ($installed -cmatch "^$pattern")) { throw "Cygwin did not install $package" }
          }
          & (Join-Path $cygwin 'bin/bash.exe') -ec 'export PATH=/usr/bin:/bin; command -v cc windres make tar gzip pkg-config; gcc --version'
      - name: Build the pinned ring engine and exercise actual LuaJIT
        if: matrix.engine == 'cygwin'
        run: cargo zapret build-ring
      - name: Build the native Windows engine and exercise the Rust Lua runtime
        if: matrix.engine == 'native-windows'
        run: cargo zapret build-ring --native-windows --conformance
      - name: Compile native release
        run: cargo zapret build --install
      - name: Replace native application with a previous menu still open
        run: cargo zapret check-install
      - name: Package native release
        run: cargo zapret package --skip-compile --candidate $env:ENGINE_CANDIDATE --output dist/native-ci.zip
      - name: Native package smoke
        run: cargo zapret check-package dist/native-ci.zip --output dist/native-smoke.json
      - name: Native launcher and menu
        run: cargo zapret check-menu dist/native-ci.zip --output dist/native-menu.json
      - name: Check the actual engine in the staged release ZIP
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'zapret-ring-release'
          Expand-Archive -LiteralPath 'dist/native-ci.zip' -DestinationPath $unpacked
          $package = Join-Path $unpacked 'zapret-rust'
          $hasCygwin = Test-Path -LiteralPath (Join-Path $package 'bin/cygwin1.dll') -PathType Leaf
          if ($hasCygwin -ne ($env:ENGINE_VARIANT -eq 'cygwin')) {
            throw 'Packaged Cygwin DLL does not match the selected engine'
          }
          cargo zapret check-engine --pkg $package --fixture $env:ENGINE_FIXTURE --output dist/native-engine-package.json
      - name: Integrated probe loopback acceptance
        run: cargo zapret check-probe bin/zapret-rust.exe --subcommand probe --benchmark-rounds 1 --output dist/native-probe.json
      - name: Preserve check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-checks-${{ matrix.engine }}
          path: |
            dist/*.json
            dist/native/*.json
            dist/native/ring-*.log
            dist/native/ring-engine-logs/*.log
            dist/native/native-engine-build/imports.log
            dist/native/native-engine-build/commands.log
            dist/rust-tools/cygwin/var/log/setup.log
          if-no-files-found: ignore

  linux-installer:
    name: Linux installer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and run the pinned upstream engine offline
        run: |
          sh -n linux/install.sh
          sh linux/install.sh --help
          installer="$PWD/linux/install.sh"
          work="$(mktemp -d)"
          cd "$work"
          sh "$installer" --prepare-only
          test -x zapret2-v1.0.7/nfq2/nfqws2
          zapret2-v1.0.7/nfq2/nfqws2 --qnum=200 --dry-run
          if sh "$installer" --prepare-only; then
            exit 1
          fi
