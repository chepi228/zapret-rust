[package]
name = "zapret-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zapret-net-probe"
path = "src/main.rs"

[dependencies]
h3 = "0.0.8"
png = "0.17"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
native-tls = { version = "0.2", features = ["alpn"] }
tokio-native-tls = "0.3"
url = "2"
getrandom = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
tempfile.workspace = true
sha2.workspace = true
zapret-core.workspace = true
zapret-platform.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
rcgen = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_System_IO"] }
